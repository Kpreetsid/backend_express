name: Validate CMMS candidate without publishing
on:
  push:
    branches: ['priority/bugs']
    paths:
      - scripts/cmms-candidate.cjs
      - .github/workflows/cmms-candidate.yml
      - '**/*regression.test.ts'
      - '**/request-boundaries.test.ts'
      - '**/scheduler-recurrence.test.ts'
      - '**/work-order-quantities.test.ts'
      - '**/schedule-calendar.ts'
permissions:
  contents: write
concurrency:
  group: cmms-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'Kpreetsid/backend_express' && github.ref == 'refs/heads/priority/bugs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      REDIS_ENABLED: 'false'
      TZ: UTC
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Create isolated test configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto');
          for (const name of ['AUTH_SECRET', 'EXTERNAL_AUTH_SECRET', 'REFRESH_TOKEN_SECRET']) {
            const value = crypto.randomBytes(48).toString('hex');
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Confirm regressions fail before the candidate
        run: |
          set +e
          node --require ts-node/register/transpile-only --test src/core/scheduler/scheduler-recurrence.test.ts src/modules/inventory/services/work-order-quantities.test.ts src/modules/work-orders/controllers/request-boundaries.test.ts src/modules/work-orders/services/cmms-regression.test.ts > baseline-regressions.log 2>&1
          result=$?
          set -e
          cat baseline-regressions.log
          test "$result" -ne 0
      - name: Prepare strictly bounded candidate changes
        run: node scripts/cmms-candidate.cjs prepare
      - name: Typecheck candidate
        run: npm run typecheck
      - name: Verify CMMS regressions
        run: npm run test:cmms
      - name: Verify existing security and asset tests
        run: npm run test:password-security && npm run test:asset-train
      - name: Build candidate
        run: npm run build
      - name: Record validated Git objects without changing a branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cmms-candidate.cjs propose
