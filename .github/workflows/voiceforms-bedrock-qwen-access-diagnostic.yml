name: VoiceForms Bedrock Qwen Access Diagnostic

on:
  push:
    branches:
      - diag/voiceforms-bedrock-qwen-v1
    paths:
      - .github/workflows/voiceforms-bedrock-qwen-access-diagnostic.yml
      - scripts/voiceforms-bedrock-qwen-access-diagnostic.py
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Assume existing Presage AWS OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::059361097726:role/oidc-for-github-actions-role
          aws-region: ap-south-1

      - name: Verify Presage Bedrock and Qwen access
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/voiceforms-bedrock-qwen-access-diagnostic.py
