name: VoiceForms Bedrock Qwen Access Diagnostic

on:
  push:
    branches:
      - diag/voiceforms-bedrock-qwen-v1
    paths:
      - .github/workflows/voiceforms-bedrock-qwen-access-diagnostic.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Assume existing Presage AWS OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::059361097726:role/oidc-for-github-actions-role
          aws-region: ap-south-1

      - name: Verify Presage account
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json | tee /tmp/identity.json
          python3 - <<'PY'
import json
j=json.load(open('/tmp/identity.json'))
print('OIDC_ACCOUNT='+str(j.get('Account')))
print('OIDC_ARN='+str(j.get('Arn')))
if j.get('Account')!='059361097726':
    raise SystemExit(9)
PY

      - name: List Qwen models visible in Mumbai
        shell: bash
        run: |
          set -euo pipefail
          aws bedrock list-foundation-models --region ap-south-1 --output json > /tmp/models.json
          python3 - <<'PY'
import json
j=json.load(open('/tmp/models.json'))
rows=[]
for m in j.get('modelSummaries',[]):
    s=' '.join(str(m.get(k,'')) for k in ('providerName','modelName','modelId'))
    if 'qwen' in s.lower():
        rows.append({
            'modelId':m.get('modelId'),
            'modelName':m.get('modelName'),
            'providerName':m.get('providerName'),
            'inferenceTypesSupported':m.get('inferenceTypesSupported')
        })
print('QWEN_MODELS='+json.dumps(rows,separators=(',',':')))
if not rows:
    raise SystemExit(10)
PY

      - name: Qwen Converse tool-call smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qwen_smoke.py <<'PY'
import json,subprocess,time
models=['qwen.qwen3-32b-v1:0','qwen.qwen3-next-80b-a3b']
messages=[{'role':'user','content':[{'text':'Overall temperature is 26.8 degrees C. Call the assert_field tool exactly once.'}]}]
tool_config={'tools':[{'toolSpec':{'name':'assert_field','description':'Record a current asserted field value.','inputSchema':{'json':{'type':'object','additionalProperties':False,'properties':{'field':{'type':'string','enum':['overallTemperature']},'value':{'type':'number'},'evidenceQuote':{'type':'string'}},'required':['field','value','evidenceQuote']}}}}],'toolChoice':{'any':{}}}
inference={'maxTokens':160,'temperature':0}
rows=[]
for model in models:
    cmd=['aws','bedrock-runtime','converse','--region','ap-south-1','--model-id',model,'--messages',json.dumps(messages,separators=(',',':')),'--tool-config',json.dumps(tool_config,separators=(',',':')),'--inference-config',json.dumps(inference,separators=(',',':')),'--output','json']
    t=time.time()
    p=subprocess.run(cmd,text=True,capture_output=True,timeout=90)
    row={'model':model,'elapsedMs':round((time.time()-t)*1000),'exitCode':p.returncode}
    if p.returncode!=0:
        row['pass']=False
        row['error']=(p.stderr or p.stdout or '')[:900]
        rows.append(row);print('QWEN_CONVERSE\t'+json.dumps(row,separators=(',',':')));continue
    d=json.loads(p.stdout)
    content=((d.get('output') or {}).get('message') or {}).get('content') or []
    calls=[x.get('toolUse') for x in content if isinstance(x,dict) and isinstance(x.get('toolUse'),dict)]
    args=(calls[0] or {}).get('input') if len(calls)==1 else {}
    ok=(len(calls)==1 and (calls[0] or {}).get('name')=='assert_field' and args.get('field')=='overallTemperature' and abs(float(args.get('value'))-26.8)<1e-9)
    row.update({'pass':bool(ok),'toolCallCount':len(calls),'stopReason':d.get('stopReason'),'usage':d.get('usage'),'metrics':d.get('metrics')})
    rows.append(row);print('QWEN_CONVERSE\t'+json.dumps(row,separators=(',',':')))
print('QWEN_CONVERSE_SUMMARY\t'+json.dumps({'total':len(rows),'pass':sum(1 for r in rows if r.get('pass'))},separators=(',',':')))
if not all(r.get('pass') for r in rows):
    raise SystemExit(7)
PY
          python3 /tmp/qwen_smoke.py
