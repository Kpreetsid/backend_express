name: CMMS priority branch validation

on:
  push:
    branches: ['priority/bugs']

permissions:
  contents: read

concurrency:
  group: cmms-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/priority/bugs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Typecheck application and test sources
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Password security regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:password-security
      - name: Asset train regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:asset-train
      - name: Verify generated catalog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run catalog:check
      - name: Build application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
